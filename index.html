<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACK BE - Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --card:#141416; --card2:#1b1b1e; --line:#26262b;
    --txt:#f4f4f5; --mut:#8b8b93; --acc:#22c55e; --acc2:#16a34a; --err:#f87171; --gold:#facc15;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{width:min(84%,1120px);margin:0 auto;padding:12px 0 20px}
  header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;margin-bottom:10px}
  .tit{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
  h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.2px}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 2s infinite}
  .dot.off{background:var(--err);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .hdr-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font:500 12px Inter,sans-serif;cursor:pointer}
  button:hover{border-color:#3a3a40}
  button:disabled{opacity:.55;cursor:default}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  .tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px}
  .tabs button{background:none;border-color:transparent;border-radius:6px;color:var(--mut)}
  .tabs button.on{background:var(--card2);color:var(--txt)}
  .top{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:8px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid #3a3a40}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:0}
  .kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kpi .v{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.15}
  .kpi.main .v{color:var(--acc)}
  .kpi .s{font-size:11px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main-grid{display:grid;grid-template-columns:1fr 210px;gap:8px;align-items:start}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;transition:border-color .4s, background .4s;overflow:hidden}
  .card .rank{position:absolute;top:8px;right:10px;font-size:11px;color:var(--mut);font-weight:600}
  .card .nm{font-size:11px;font-weight:600;color:#d4d4d8;letter-spacing:.3px;padding-right:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .n{font-size:22px;font-weight:800;margin:1px 0;font-variant-numeric:tabular-nums;line-height:1.2}
  .card .meta{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:6px;line-height:1.4;font-variant-numeric:tabular-nums}
  .card .bar{height:3px;background:var(--card2);border-radius:3px;margin-top:6px;overflow:hidden}
  .card .bar i{display:block;height:100%;background:var(--acc2);border-radius:3px;transition:width .6s}
  .card.flash{border-color:var(--acc);background:#10251a}
  .card.err .n{color:var(--err);font-size:13px;font-weight:600;margin:5px 0}
  .card.lead1 .rank{color:var(--gold)}
  .plus{position:absolute;right:10px;top:25px;font-weight:800;color:var(--acc);font-size:15px;animation:rise 2.4s ease-out forwards}
  @keyframes rise{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
  .feed{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px;max-height:min(calc(100vh - 160px),440px);overflow:auto}
  .feed h2{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:0 0 4px;font-weight:600}
  .ev{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12px}
  .ev:first-of-type{border-top:0}
  .ev b{color:var(--acc)} .ev time{color:var(--mut);font-size:11px;white-space:nowrap}
  .empty{color:var(--mut);font-size:12px;padding:6px 0}
  .banner{display:none;background:#2a1215;border:1px solid #5b1d22;color:#fecaca;padding:6px 11px;border-radius:8px;margin-bottom:10px;font-size:12px}
  .demo{background:#2a2410;border-color:#5b4d1d;color:#fde68a}
  .bar-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .bar-acoes .info{font-size:12px;color:var(--mut)}
  .filtros{display:flex;flex-wrap:wrap;gap:6px}
  .filtros button.on{border-color:var(--acc);color:var(--acc)}
  .ord{background:none;border:0;padding:0;font:inherit;color:inherit;border-radius:3px}
  .ord:hover{color:var(--txt)}
  th[aria-sort] .ord{color:var(--acc)}
  .tabela{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:auto;max-height:min(calc(100vh - 110px),620px)}
  .tabela.aberta{max-height:none;overflow:visible}
  .aberta th:first-child{border-top-left-radius:8px}
  .aberta th:last-child{border-top-right-radius:8px}
  .secao{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px;font-weight:600}
  .medidor{position:relative;height:4px;background:var(--card2);border-radius:3px;margin-top:4px;min-width:90px}
  .medidor i{display:block;height:100%;background:var(--acc2);border-radius:3px}
  .medidor b{position:absolute;top:-2px;width:2px;height:8px;background:var(--txt)}
  table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  thead{position:sticky;top:0;z-index:1}
  th{background:var(--card2);color:var(--mut);font-size:11px;font-weight:600;text-align:right;padding:7px 10px;white-space:nowrap}
  td{padding:6px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
  th.esq,td.esq{text-align:left}
  td.nome{white-space:normal;min-width:160px}
  td.forte{font-weight:700}
  .tag{display:inline-block;min-width:62px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.4px;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--mut)}
  .tag.lead{color:var(--acc)} .tag.erro{color:var(--err)} .tag.manual,.tag.info{color:var(--txt)}
  td.msg{text-align:left;white-space:normal;min-width:260px;width:100%}
  @media (max-width:1000px){.top{grid-template-columns:repeat(2,1fr)}.kpi.main{grid-column:1/-1}.main-grid{grid-template-columns:1fr}.feed{max-height:none}}
  @media (max-width:1000px){.wrap{width:auto;padding:12px 16px 20px}}
  @media (max-width:860px){.tabela.aberta{overflow-x:auto}}
  @media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tit">
      <h1>Leads Tempo Real - Black BE</h1>
      <div class="live"><span class="dot" id="dot"></span><span id="status">Conectando…</span></div>
    </div>
    <div class="hdr-r">
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-aba="painel">Painel</button>
        <button role="tab" data-aba="campanhas">Campanhas</button>
        <button role="tab" data-aba="estrategia">Estratégia</button>
        <button role="tab" data-aba="logs">Logs</button>
      </nav>
      <button id="atualizar" title="Buscar os dados agora">↻ Atualizar</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <main id="aba-painel">
    <section class="top">
      <div class="kpi main"><div class="l">Leads hoje</div><div class="v" id="total">–</div><div class="s" id="totalS">&nbsp;</div></div>
      <div class="kpi"><div class="l">Investimento</div><div class="v" id="gasto">–</div><div class="s" id="unid">&nbsp;</div></div>
      <div class="kpi"><div class="l">Custo por lead</div><div class="v" id="cpl">–</div><div class="s">média das unidades</div></div>
      <div class="kpi" title="Conversas com 3 ou mais mensagens do cliente ÷ conversas iniciadas."><div class="l">Qualificação</div><div class="v" id="taxa">–</div><div class="s" id="conv">&nbsp;</div></div>
    </section>

    <div class="main-grid">
      <div class="grid" id="grid"></div>
      <aside class="feed"><h2>Chegadas recentes</h2><div id="feed"><div class="empty">Aguardando novos leads…</div></div></aside>
    </div>
  </main>

  <main id="aba-campanhas" hidden>
    <div class="bar-acoes">
      <span class="info" id="campInfo"></span>
    </div>
    <div class="tabela aberta"><table>
      <thead id="campCab"></thead>
      <tbody id="campLinhas"></tbody>
    </table></div>
  </main>

  <main id="aba-estrategia" hidden>
    <div class="bar-acoes">
      <span class="info" id="estInfo"></span>
    </div>
    <h2 class="secao">Orçamento, alcance e frequência por unidade</h2>
    <div class="tabela aberta"><table>
      <thead id="uniCab"></thead>
      <tbody id="uniLinhas"></tbody>
    </table></div>
    <h2 class="secao">Por anúncio · hoje</h2>
    <div class="tabela aberta"><table>
      <thead id="adCab"></thead>
      <tbody id="adLinhas"></tbody>
    </table></div>
  </main>

  <main id="aba-logs" hidden>
    <div class="bar-acoes">
      <div class="filtros" id="filtros">
        <button data-f="todos">Todos</button>
        <button data-f="lead">Leads</button>
        <button data-f="erro">Erros</button>
        <button data-f="ok">Atualizações</button>
      </div>
      <button id="limpar">Limpar logs</button>
    </div>
    <div class="tabela"><table>
      <thead><tr><th class="esq">Horário</th><th class="esq">Tipo</th><th class="esq">Evento</th></tr></thead>
      <tbody id="logLinhas"></tbody>
    </table></div>
  </main>
</div>

<script>
const INTERVALO = 10000;
const MAX_LOGS = 300;
const CHAVE_LOGS = 'dash-leads-logs';
const DEMO = new URLSearchParams(location.search).has('demo');
const brl = v => v == null ? '–' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:v>=1000?0:2});
const hora = d => d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const dataHora = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' + hora(d);
const pct = v => v == null ? '–' : v.toLocaleString('pt-BR',{style:'percent',maximumFractionDigits:1});
const razao = (a, b) => b ? a/b : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

let anterior = null;       // {unidade: leads}
let diaAnterior = new Date().toDateString();
let eventos = [];
let campanhas = [];
let errosAtivos = {};      // {unidade: mensagem}
let ultimoOk = null;
let buscando = false;
let timer = null;

// ---- abas ----
const ABAS = ['painel','campanhas','estrategia','logs'];
let abaAtual = 'painel';
function abrirAba(nome){
  const aba = ABAS.includes(nome) ? nome : 'painel';
  abaAtual = aba;
  ABAS.forEach(a => $('aba-'+a).hidden = a !== aba);
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.aba === aba);
    b.setAttribute('aria-selected', b.dataset.aba === aba);
  });
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { location.hash = b.dataset.aba; });
addEventListener('hashchange', () => { abrirAba(location.hash.slice(1)); carregarEstrategia(); });
abrirAba(location.hash.slice(1));

// ---- logs ----
let filtroLog = 'todos';
const ROTULOS = {ok:'ATUALIZAÇÃO', manual:'MANUAL', lead:'LEAD', erro:'ERRO', info:'INFO'};
function lerLogs(){ try { return JSON.parse(localStorage.getItem(CHAVE_LOGS)) || []; } catch(_) { return []; } }
function salvarLogs(){ try { localStorage.setItem(CHAVE_LOGS, JSON.stringify(logs)); } catch(_) {} }
let logs = lerLogs();

// Atualizações seguidas e erros repetidos viram uma linha só, com contador.
function registrar(tipo, texto){
  const topo = logs[0];
  if (topo && topo.tipo === tipo && (tipo === 'ok' || topo.texto === texto)) {
    topo.t = Date.now(); topo.texto = texto; topo.vezes = (topo.vezes || 1) + 1;
  } else {
    logs.unshift({tipo, texto, t:Date.now()});
  }
  logs = logs.slice(0, MAX_LOGS);
  salvarLogs();
  renderLogs();
}
function renderLogs(){
  const passa = l => filtroLog === 'todos' || l.tipo === filtroLog || (filtroLog === 'ok' && l.tipo === 'manual');
  const linhas = logs.filter(passa);
  $('logLinhas').innerHTML = linhas.length
    ? linhas.map(l => `<tr><td class="esq">${dataHora(new Date(l.t))}</td><td class="esq"><span class="tag ${l.tipo}">${ROTULOS[l.tipo]}</span></td><td class="msg">${esc(l.texto)}${l.vezes>1?` <span style="color:var(--mut)">(${l.vezes}x)</span>`:''}</td></tr>`).join('')
    : '<tr><td class="msg" colspan="3"><div class="empty">Nenhum registro.</div></td></tr>';
  document.querySelectorAll('#filtros button').forEach(b => b.classList.toggle('on', b.dataset.f === filtroLog));
}
document.querySelectorAll('#filtros button').forEach(b => b.onclick = () => { filtroLog = b.dataset.f; renderLogs(); });
$('limpar').onclick = () => { logs = []; salvarLogs(); renderLogs(); };
renderLogs();

// ---- modo demonstração (?demo) ----
const demoCampanha = i => {
  const conversas = Math.floor(Math.random()*14), m3 = Math.floor(conversas*Math.random()*.5), bloqueios = Math.random()<.1 ? 1 : 0;
  return {id:String(i), nome:`${i===2?'[TRÁFEGO]':'[MENSAGENS]'} Público ${String.fromCharCode(65+i)}`, ativa:i!==3, leads:conversas, conversas, m3, bloqueios, gasto:Math.random()*220+40};
};
const demoBase = ['F. SANTANA','FORTALEZA','MOSSORO','TERESINA','SALVADOR','CAMPINA GRANDE','CARUARU','JOAO PESSOA','NATAL','RECIFE','RIBEIRAO PRETO','BRASILIA','PRAIA GRANDE','CAMPINAS','DOURADOS','MACEIO','PATOS']
  .map(u => ({unidade:u, campanhas:Array.from({length:1+Math.floor(Math.random()*4)}, (_,i)=>demoCampanha(i))}));
async function buscarDemo(){
  demoBase.forEach(u => u.campanhas.forEach(c => {
    if (Math.random() < .1) { c.leads += 1; c.conversas += 1; c.m3 += Math.random()<.3; c.gasto += Math.random()*15; }
  }));
  const somar = (u,campo) => u.campanhas.reduce((s,c)=>s+c[campo],0);
  return {atualizadoEm:new Date().toISOString(), unidades: demoBase.map(u=>({
    unidade:u.unidade, erro:null, campanhas:u.campanhas.map(c=>({...c})),
    leads:somar(u,'leads'), gasto:somar(u,'gasto'), conversas:somar(u,'conversas'), m3:somar(u,'m3'), bloqueios:somar(u,'bloqueios'),
  }))};
}

// A CDN guarda a resposta por 8 s; a atualização manual fura esse cache.
async function buscar(manual){
  if (DEMO) return buscarDemo();
  const r = await fetch('/api/leads' + (manual ? '?t=' + Date.now() : ''), {cache:'no-store'});
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'Erro ' + r.status);
  return j;
}

function render(d){
  const us = d.unidades;
  const ok = us.filter(u => u.leads != null);
  const total = ok.reduce((s,u)=>s+u.leads,0);
  const gasto = ok.reduce((s,u)=>s+(u.gasto||0),0);
  const conversas = ok.reduce((s,u)=>s+(u.conversas||0),0);
  const m3 = ok.reduce((s,u)=>s+(u.m3||0),0);
  const bloqueios = ok.reduce((s,u)=>s+(u.bloqueios||0),0);
  const max = Math.max(1, ...ok.map(u=>u.leads));
  campanhas = ok.flatMap(u => (u.campanhas||[]).map(c => ({...c, unidade:u.unidade})));

  // virada do dia: zera o histórico
  const hoje = new Date().toDateString();
  if (hoje !== diaAnterior) { anterior = null; eventos = []; diaAnterior = hoje; }

  const novos = {};
  if (anterior) for (const u of ok) {
    const diff = u.leads - (anterior[u.unidade] ?? u.leads);
    if (diff > 0) {
      novos[u.unidade] = diff;
      eventos.unshift({unidade:u.unidade, n:diff, t:new Date()});
      registrar('lead', `+${diff} ${diff>1?'leads':'lead'} em ${u.unidade}`);
    }
  }
  eventos = eventos.slice(0, 60);

  for (const u of us) {
    const erro = u.erro || u.erroStatus;
    if (erro && errosAtivos[u.unidade] !== erro) {
      errosAtivos[u.unidade] = erro;
      registrar('erro', `${u.unidade}: ${erro}`);
    } else if (!erro && errosAtivos[u.unidade]) {
      delete errosAtivos[u.unidade];
      registrar('info', `${u.unidade} voltou a responder`);
    }
  }

  const prevTotal = anterior ? Object.values(anterior).reduce((a,b)=>a+b,0) : null;
  $('total').textContent = total.toLocaleString('pt-BR');
  if (prevTotal != null && total > prevTotal) $('totalS').textContent = `+${total-prevTotal} na última atualização`;
  $('gasto').textContent = brl(gasto);
  $('cpl').textContent = total ? brl(gasto/total) : '–';
  $('unid').textContent = `${ok.length} de ${us.length} unidades · ${campanhas.length} campanhas`;
  $('taxa').textContent = pct(razao(m3, conversas));
  $('conv').textContent = `${m3.toLocaleString('pt-BR')} de ${conversas.toLocaleString('pt-BR')} conversas · ${bloqueios} ${bloqueios===1?'bloqueio':'bloqueios'}`;

  const ordenadas = [...us].sort((a,b)=>(b.leads??-1)-(a.leads??-1));
  $('grid').innerHTML = ordenadas.map((u,i) => {
    if (u.leads == null) return `<div class="card err"><div class="nm">${esc(u.unidade)}</div><div class="n">Erro</div><div class="meta"><span title="${esc(u.erro)}">${esc((u.erro||'').slice(0,40))}</span></div></div>`;
    const cpl = u.leads ? brl(u.gasto/u.leads) : '–';
    const nCamp = (u.campanhas||[]).filter(campanhaExibida).length;
    return `<div class="card ${novos[u.unidade]?'flash':''} ${i===0?'lead1':''}" data-u="${esc(u.unidade)}">
      <div class="rank">${i===0?'★ ':''}#${i+1}</div>
      <div class="nm">${esc(u.unidade)}</div>
      <div class="n">${u.leads}</div>
      <div class="meta"><span>${brl(u.gasto)}</span><span>CPL ${cpl}</span></div>
      <div class="meta"><span>${nCamp} ${nCamp===1?'campanha ativa':'campanhas ativas'}</span></div>
      <div class="bar"><i style="width:${(u.leads/max*100).toFixed(1)}%"></i></div>
      ${novos[u.unidade]?`<span class="plus">+${novos[u.unidade]}</span>`:''}
    </div>`;
  }).join('');
  setTimeout(()=>document.querySelectorAll('.card.flash').forEach(c=>c.classList.remove('flash')), 2500);

  $('feed').innerHTML = eventos.length
    ? eventos.map(e=>`<div class="ev"><span><b>+${e.n}</b> ${e.n>1?'leads':'lead'} · ${esc(e.unidade)}</span><time>${hora(e.t)}</time></div>`).join('')
    : '<div class="empty">Aguardando novos leads…</div>';

  renderCampanhas();
  anterior = Object.fromEntries(ok.map(u=>[u.unidade,u.leads]));
}

// ---- tabelas ordenadas pelo título da coluna ----
function tabelaOrdenavel(idCab, idCorpo, colunas, inicial, vazio, celulas){
  let ordem = inicial, dados = [];
  $(idCab).innerHTML = `<tr>${colunas.map(c => `<th class="${c.txt?'esq':''}" data-k="${c.k}"><button class="ord" title="${c.dica || 'Ordenar'}">${c.t}<span class="seta"></span></button></th>`).join('')}</tr>`;

  function comparar(a, b){
    const x = a[ordem.k], y = b[ordem.k];
    if (x == null || y == null) return (x == null) - (y == null);   // sem valor fica sempre no fim
    return ordem.dir * (typeof x === 'string' ? x.localeCompare(y, 'pt-BR') : x - y);
  }
  function desenhar(){
    document.querySelectorAll(`#${idCab} th[data-k]`).forEach(th => {
      const ativa = th.dataset.k === ordem.k;
      if (ativa) th.setAttribute('aria-sort', ordem.dir > 0 ? 'ascending' : 'descending'); else th.removeAttribute('aria-sort');
      th.querySelector('.seta').textContent = ativa ? (ordem.dir > 0 ? ' ▲' : ' ▼') : '';
    });
    $(idCorpo).innerHTML = dados.length
      ? [...dados].sort(comparar).map(l => `<tr>${celulas(l)}</tr>`).join('')
      : `<tr><td class="esq" colspan="${colunas.length}"><div class="empty">${vazio}</div></td></tr>`;
  }
  $(idCab).onclick = e => {
    const th = e.target.closest('.ord')?.closest('th');
    if (!th) return;
    const k = th.dataset.k;
    ordem = ordem.k === k ? {k, dir:-ordem.dir} : {k, dir:colunas.find(c => c.k === k).txt ? 1 : -1};
    desenhar();
  };
  return novos => { dados = novos; desenhar(); };
}

// ---- aba Campanhas: só campanhas ativas com a tag abaixo ----
const TAG_CAMPANHA = '[MENSAGENS]';
const campanhaExibida = c => c.ativa !== false && c.nome.toUpperCase().includes(TAG_CAMPANHA);
const mostrarCampanhas = tabelaOrdenavel('campCab', 'campLinhas', [
  {k:'nome', t:'Campanha', txt:true},
  {k:'unidade', t:'Unidade', txt:true},
  {k:'conversas', t:'Conversas'},
  {k:'m3', t:'3+ msgs', dica:'Conversas com 3 ou mais mensagens do cliente'},
  {k:'gasto', t:'Investimento'},
  {k:'cpl', t:'CPL'},
], {k:'conversas', dir:-1}, 'Nenhuma campanha encontrada.', c => `
  <td class="esq nome">${esc(c.nome)}</td><td class="esq">${esc(c.unidade)}</td>
  <td class="forte">${c.conversas}</td><td>${c.m3}</td>
  <td>${brl(c.gasto)}</td><td>${brl(c.cpl)}</td>`);

function renderCampanhas(){
  const linhas = campanhas
    .filter(campanhaExibida)
    .map(c => ({...c, cpl: razao(c.gasto, c.leads)}));
  $('campInfo').textContent = linhas.length === 1 ? '1 campanha ativa' : `${linhas.length} campanhas ativas`;
  mostrarCampanhas(linhas);
}

// ---- aba Estratégia: consulta mais pesada, só roda com a aba aberta ----
const INTERVALO_ESTRATEGIA = 120000;
const inteiro = v => v == null ? '–' : v.toLocaleString('pt-BR');
const freq = v => v == null ? '–' : v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fracaoDoDia = () => { const a = new Date(); return (a.getHours() + a.getMinutes()/60) / 24; };
let fracaoDia = fracaoDoDia();
let estCarregada = false;
let buscandoEst = false;
const errosEst = new Set();

const medidor = v => v == null ? '' : `<div class="medidor"><i style="width:${Math.min(v*100,100).toFixed(1)}%"></i><b style="left:${(fracaoDia*100).toFixed(1)}%" title="Parte do dia que já passou"></b></div>`;

const mostrarUnidades = tabelaOrdenavel('uniCab', 'uniLinhas', [
  {k:'unidade', t:'Unidade', txt:true},
  {k:'orcamento', t:'Orçamento diário', dica:'Campanhas ativas [MENSAGENS] com conjuntos no período de veiculação hoje'},
  {k:'consumido', t:'Consumido', dica:'Gasto de hoje nessas mesmas campanhas'},
  {k:'pct', t:'% consumido', dica:'A marca branca mostra quanto do dia já passou'},
  {k:'alcanceHoje', t:'Alcance hoje', dica:'Todas as campanhas da unidade'},
  {k:'freqHoje', t:'Freq. hoje', dica:'Todas as campanhas da unidade'},
  {k:'alcance7d', t:'Alcance 7 dias', dica:'Todas as campanhas da unidade'},
  {k:'freq7d', t:'Freq. 7 dias', dica:'Todas as campanhas da unidade'},
], {k:'pct', dir:-1}, 'Nenhuma unidade encontrada.', u => `
  <td class="esq">${esc(u.unidade)}</td><td>${brl(u.orcamento)}</td><td>${brl(u.consumido)}</td>
  <td class="forte">${pct(u.pct)}${medidor(u.pct)}</td>
  <td>${inteiro(u.alcanceHoje)}</td><td>${freq(u.freqHoje)}</td>
  <td>${inteiro(u.alcance7d)}</td><td>${freq(u.freq7d)}</td>`);

const mostrarAnuncios = tabelaOrdenavel('adCab', 'adLinhas', [
  {k:'nome', t:'Anúncio', txt:true},
  {k:'unidade', t:'Unidade', txt:true},
  {k:'conversas', t:'Conversas'},
  {k:'m3', t:'3+ msgs'},
  {k:'gasto', t:'Investimento'},
  {k:'ctr', t:'CTR'},
  {k:'custo', t:'Custo/conversa'},
], {k:'conversas', dir:-1}, 'Nenhum anúncio ativo com entrega hoje.', a => `
  <td class="esq nome" title="${esc(a.campanha)}">${esc(a.nome)}</td><td class="esq">${esc(a.unidade)}</td>
  <td class="forte">${a.conversas}</td><td>${a.m3}</td><td>${brl(a.gasto)}</td>
  <td>${a.ctr == null ? '–' : freq(a.ctr) + '%'}</td><td>${brl(a.custo)}</td>`);

function demoEstrategia(){
  const unidades = demoBase.map(u => {
    const orcamento = 200 + Math.floor(Math.random()*7)*50, alcanceHoje = 2000 + Math.floor(Math.random()*9000);
    return {unidade:u.unidade, orcamento, consumido:orcamento*Math.random()*.9, semDiario:0, alcanceHoje,
      freqHoje:1 + Math.random()*.4, alcance7d:alcanceHoje*4, freq7d:1.5 + Math.random()*2, erro:null};
  });
  const anuncios = demoBase.flatMap(u => u.campanhas.filter(c => c.ativa && c.nome.includes(TAG_CAMPANHA)).map(c => ({
    id:u.unidade+c.id, nome:`Criativo ${c.id} · ${u.unidade}`, unidade:u.unidade, campanha:c.nome,
    gasto:c.gasto, impressoes:Math.floor(c.gasto*90), ctr:.6 + Math.random()*2, conversas:c.conversas, m3:c.m3,
  })));
  return {unidades, anuncios};
}

async function buscarEstrategia(){
  if (DEMO) return demoEstrategia();
  const r = await fetch('/api/estrategia', {cache:'no-store'});
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'Erro ' + r.status);
  return j;
}

function renderEstrategia(d){
  fracaoDia = fracaoDoDia();
  const somar = campo => d.unidades.reduce((s,u)=>s+(u[campo]||0),0);
  const orcamento = somar('orcamento'), consumido = somar('consumido'), semDiario = somar('semDiario'), fora = somar('foraDoPeriodo');
  const partes = [
    `Orçamento do dia ${TAG_CAMPANHA} ${brl(orcamento)}`,
    `consumido ${brl(consumido)} (${pct(razao(consumido, orcamento))})`,
    `${pct(fracaoDia)} do dia já passou`,
  ];
  if (semDiario) partes.push(`${semDiario} ${semDiario===1?'campanha':'campanhas'} sem orçamento diário fora da conta`);
  if (fora) partes.push(`${fora} ${fora===1?'conjunto':'conjuntos'} fora do período não ${fora===1?'conta':'contam'}`);
  const semOrcamento = d.unidades.filter(u => u.orcamento == null);
  if (semOrcamento.length) partes.push(`${semOrcamento.length} de ${d.unidades.length} unidades sem dados de orçamento agora`);
  $('estInfo').textContent = semOrcamento.length === d.unidades.length
    ? `Orçamento indisponível agora: ${semOrcamento[0].erro || 'sem resposta da Meta'}`
    : partes.join(' · ');
  mostrarUnidades(d.unidades.map(u => ({...u, pct:razao(u.consumido, u.orcamento)})));
  mostrarAnuncios(d.anuncios.map(a => ({...a, custo:razao(a.gasto, a.conversas)})));
  for (const u of d.unidades) {
    const texto = u.erro && `Estratégia · ${u.unidade}: ${u.erro}`;
    if (texto && !errosEst.has(texto)) { errosEst.add(texto); registrar('erro', texto); }
  }
}

async function carregarEstrategia(){
  if (abaAtual !== 'estrategia' || buscandoEst) return;
  buscandoEst = true;
  if (!estCarregada) $('estInfo').textContent = 'Carregando…';
  try {
    renderEstrategia(await buscarEstrategia());
    estCarregada = true;
  } catch (e) {
    registrar('erro', 'Falha na aba Estratégia: ' + e.message);
    $('estInfo').textContent = 'Erro ao buscar dados: ' + e.message;
  } finally {
    buscandoEst = false;
  }
}

async function ciclo(manual){
  if (buscando) return;
  buscando = true;
  clearTimeout(timer);
  $('atualizar').disabled = true;
  const inicio = performance.now();
  try {
    const d = await buscar(manual);
    render(d);
    ultimoOk = new Date();
    const ms = Math.round(performance.now() - inicio);
    const nOk = d.unidades.filter(u => u.leads != null).length;
    registrar(manual ? 'manual' : 'ok', `${nOk} de ${d.unidades.length} unidades · ${campanhas.length} campanhas · ${ms} ms`);
    $('dot').classList.remove('off');
    $('status').textContent = `Ao vivo · atualizado às ${hora(ultimoOk)}`;
    $('banner').style.display = DEMO ? 'block' : 'none';
  } catch (e) {
    registrar('erro', 'Falha na atualização: ' + e.message);
    $('dot').classList.add('off');
    $('status').textContent = ultimoOk ? `Sem conexão · último dado às ${hora(ultimoOk)}` : 'Sem conexão';
    $('banner').className = 'banner'; $('banner').style.display='block';
    $('banner').textContent = 'Erro ao buscar dados: ' + e.message;
  } finally {
    buscando = false;
    $('atualizar').disabled = false;
    timer = setTimeout(ciclo, INTERVALO);
  }
}
$('atualizar').onclick = () => { ciclo(true); carregarEstrategia(); };
if (DEMO) { $('banner').className='banner demo'; $('banner').textContent='Modo demonstração: números fictícios.'; }
ciclo();
carregarEstrategia();
setInterval(carregarEstrategia, INTERVALO_ESTRATEGIA);
</script>
</body>
